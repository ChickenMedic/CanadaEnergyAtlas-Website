name: Update benchmark prices

on:
  schedule:
    # Weekdays at 13:15 UTC, after EIA's morning data refresh.
    - cron: '15 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest prices
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: node scripts/fetch-prices.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet public/prices.json; then
            echo "No price changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/prices.json
          git commit -m "chore: update benchmark prices"
          git push
